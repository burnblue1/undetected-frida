name: Build Florida (Undetected Frida)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch:
          - x86_64
          - arm64
        os:
          - android

    steps:
      - uses: actions/checkout@v5

      - name: Node 18 setup
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Python 3.11 setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison libc6-dev libc6-dev-i386 xz-utils
          pip3 install -U setuptools lief

      - name: Build Frida + Florida
        run: |
          FRIDA_VERSION="17.9.10"
          git clone --recurse-submodules https://github.com/frida/frida -b "${FRIDA_VERSION}"
          cd frida
          
          FRIDA_PREFIX="$(tr -cd 'a-z0-9' </dev/urandom | head -c32)"
          for k in ../strongR-frida ../florida ../rycoh99; do
            for i in ${k}/*; do
              pushd subprojects/${i##*/}
              for j in ${i}/*.patch; do
                FRIDA_PREFIX="${FRIDA_PREFIX}" envsubst <"${j}" | patch -Np1
              done
              popd
            done
          done
          
          ./configure --host="${{ matrix.os }}-${{ matrix.arch }}" --enable-server
          make

      - name: Upload frida-server
        uses: actions/upload-artifact@v5
        with:
          name: florida-server-${{ matrix.arch }}
          path: frida/build/
