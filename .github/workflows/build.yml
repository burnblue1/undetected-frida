name: undetected-frida
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch:
        - arm64
        - x86_64
        os:
        - android

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Node 18 setup
      uses: actions/setup-node@v5
      with:
        node-version: 18

    - name: JDK 8 setup
      uses: actions/setup-java@v5
      with:
        java-version: "8"
        distribution: temurin

    - name: Python 3.11 setup
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: NDK 29 setup
      run: |
        curl -sSLO https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        [ "$(sha1sum android-ndk-r29-linux.zip | awk '{print $1}')" = "87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b" ] || exit 1
        unzip -qo android-ndk-r29-linux.zip
        rm android-ndk-r29-linux.zip
        [ $(id -u) -eq 0 ] || SUDO=sudo
        export ANDROID_NDK="${ANDROID_NDK:-/usr/local/lib/android/sdk/ndk/29.0.14206865}"
        ${SUDO} /bin/sh -ec "rm -rf '${ANDROID_NDK%/*}/29.0.14206865'; mkdir -p '${ANDROID_NDK%/*}'; mv -v android-ndk-r29 '${ANDROID_NDK%/*}/29.0.14206865'"
        export ANDROID_NDK="${ANDROID_NDK%/*}/29.0.14206865"
        export ANDROID_NDK_HOME="${ANDROID_NDK}" ANDROID_NDK_ROOT="${ANDROID_NDK}"

    - name: Install dependencies
      run: |
        [ $(id -u) -eq 0 ] || SUDO=sudo
        ${SUDO} apt-get update && DEBIAN_FRONTEND=noninteractive ${SUDO} apt-get install -y build-essential ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison libc6-dev libc6-dev-i386 xz-utils plzip zstd pigz gettext-base
        pip3 install -U setuptools lief

    - name: Build Frida
      run: |
        export ANDROID_NDK="/usr/local/lib/android/sdk/ndk/29.0.14206865"
        FRIDA_VERSION="17.9.10"
        cd frida
        
        FRIDA_PREFIX="$(tr -cd 'a-z0-9' </dev/urandom | head -c32)"
        SESSION_SERVICE="$(tr -cd 'a-f0-9' </dev/urandom | head -c32)"

        for k in ../strongR-frida ../florida ../rycoh99; do
          for i in "${k}/"*; do
            pushd "subprojects/${i##*/}"
            for j in "${i}/"*.patch; do
              FRIDA_PREFIX="${FRIDA_PREFIX}" SESSION_SERVICE="${SESSION_SERVICE}" envsubst <"${j}" | patch -Np1
            done
            popd
          done
        done

        ./configure --prefix="${PWD}/build" --host="${{ matrix.os }}-${{ matrix.arch }}" --enable-server --enable-gadget
        make

    - name: Upload frida-server
      uses: actions/upload-artifact@v5
      with:
        name: frida-server-${{ matrix.arch }}
        path: frida/build/subprojects/frida-core/server/frida-server
