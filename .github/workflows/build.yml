name: Build Florida
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64, arm64]
        os: [android]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build gcc-multilib g++-multilib lib32z-dev flex bison xz-utils

      - name: Build Undetected Frida (Florida)
        run: |
          ./configure --host=${{ matrix.os }}-${{ matrix.arch }} --enable-server
          make

      - name: Upload frida-server
        uses: actions/upload-artifact@v5
        with:
          name: florida-server-${{ matrix.arch }}
          path: build/subprojects/frida-core/server/frida-server
