name: Build Florida (Undetected Frida)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64, arm64]
        os: [android]

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install NDK r29
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29

    - name: Setup Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential gcc-multilib g++-multilib ninja-build flex bison

    - name: Build Frida with Florida
      run: |
        git clone --recurse-submodules https://github.com/frida/frida -b 17.9.10
        cd frida

        # 打 Florida 补丁
        for dir in ../florida ../strongR-frida; do
          for module in $dir/*; do
            mod=$(basename $module)
            if [ -d "subprojects/$mod" ]; then
              cd subprojects/$mod
              for p in $module/*.patch; do
                patch -Np1 < $p || true
              done
              cd ../..
            fi
          done
        done

        # 官方编译脚本（自动用 NDK r29）
        python3 releng/build.py --os ${{ matrix.os }} --arch ${{ matrix.arch }}

    - name: Upload frida-server
      uses: actions/upload-artifact@v5
      with:
        name: florida-server-${{ matrix.arch }}
        path: frida/build/
