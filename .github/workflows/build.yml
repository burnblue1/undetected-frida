name: Build Florida (Undetected Frida)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64, arm64]
        os: [android]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Node 18
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison xz-utils
          pip3 install -U setuptools lief

      - name: Build
        run: |
          cd frida
          ./configure --host=${{ matrix.os }}-${{ matrix.arch }} --enable-server
          make

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: server-${{ matrix.arch }}
          path: frida/build/subprojects/frida-core/server/frida-server
