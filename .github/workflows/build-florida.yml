name: Build Florida (x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Frida
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 17.7.0
          submodules: recursive

      - name: Clone Florida Patch
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          path: patch/Florida

      - name: Apply Patch
        run: |
          cp -rf patch/Florida/frida-core/* frida-core/ 2>/dev/null || :
          cp -rf patch/Florida/src/* src/ 2>/dev/null || :

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y build-essential meson ninja-build python3-pip
          pip3 install pyparsing

      # 重点：编译 x86_64 版本（电脑模拟器）
      - name: Build for android x86_64
        run: |
          python3 build.py -f android x86_64

      - name: Upload Final Server
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-x86_64
          path: build/frida-android-x86_64/bin/frida-server
