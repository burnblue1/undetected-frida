name: Build Florida Frida Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frida
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 17.7.0
          submodules: true

      - name: Checkout Florida Patch
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          path: florida

      - name: Apply Florida Patch
        run: |
          cp -n florida/frida-core/* frida-core/ 2>/dev/null || true
          cp -n florida/src/* src/ 2>/dev/null || true

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential meson ninja-build python3-pip
          pip3 install pyparsing

      - name: Build Android arm64
        run: |
          python3 build.py --full --android arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-arm64
          path: build/frida-android-arm64/bin/frida-server
